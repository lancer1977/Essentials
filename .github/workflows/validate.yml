name: Validate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: essentials-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stewardship:
    name: Stewardship smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Validate repository
        run: ./scripts/validate.sh
